<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorizava Archive v1.0</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<link rel="stylesheet" href="css/app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" as="style">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
</head>
<body>
<!-- ── 로그인 화면 ── -->
<div id="_login_screen" style="display:none;position:fixed;inset:0;z-index:9999;background:#0C1524;align-items:center;justify-content:center;font-family:'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(37,99,235,.18) 0%,transparent 60%),radial-gradient(ellipse at 70% 20%,rgba(124,58,237,.12) 0%,transparent 55%);pointer-events:none"></div>
  <div style="position:relative;width:440px;max-width:92vw;background:#111C2E;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:40px 40px 36px;box-shadow:0 32px 80px rgba(0,0,0,.5)">
    <div style="text-align:center;margin-bottom:32px">
      <div style="width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,#2563EB,#7C3AED);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 8px 24px rgba(37,99,235,.4)">
        <i class="ti ti-building-community" style="font-size:28px;color:#fff" aria-hidden="true"></i>
      </div>
      <div style="font-size:23px;font-weight:900;color:#fff;margin-bottom:5px;letter-spacing:-.3px">Sorizava Archive</div>
      <div style="font-size:13px;color:#64748B">채용 관리 시스템 v1.0</div>
    </div>
    <div style="margin-bottom:20px">
      <div style="font-size:10.5px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px">계정 유형</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
        <button id="_login_role_master" onclick="selectRole('master')" style="padding:13px;border-radius:12px;border:1.5px solid #2563EB;background:rgba(37,99,235,.15);cursor:pointer;text-align:left;transition:all .15s">
          <div style="display:flex;align-items:center;gap:7px;margin-bottom:5px">
            <i class="ti ti-shield-check" style="font-size:16px;color:#60A5FA" aria-hidden="true"></i>
            <span style="font-size:13px;font-weight:700;color:#fff">교육팀</span>
          </div>
          <div style="font-size:10.5px;color:#64748B;line-height:1.4">전체 권한 · 모든 기능</div>
        </button>
        <button id="_login_role_staff" onclick="selectRole('staff')" style="padding:13px;border-radius:12px;border:1.5px solid rgba(255,255,255,.1);background:transparent;cursor:pointer;text-align:left;transition:all .15s">
          <div style="display:flex;align-items:center;gap:7px;margin-bottom:5px">
            <i class="ti ti-user-check" style="font-size:16px;color:#64748B" aria-hidden="true"></i>
            <span style="font-size:13px;font-weight:700;color:#64748B">상담팀</span>
          </div>
          <div style="font-size:10.5px;color:#64748B;line-height:1.4">채용 현황 조회 · 개인정보 비공개</div>
        </button>
        <button id="_login_role_staff2" onclick="selectRole('staff2')" style="padding:13px;border-radius:12px;border:1.5px solid rgba(255,255,255,.1);background:transparent;cursor:pointer;text-align:left;transition:all .15s">
          <div style="display:flex;align-items:center;gap:7px;margin-bottom:5px">
            <i class="ti ti-user" style="font-size:16px;color:#64748B" aria-hidden="true"></i>
            <span style="font-size:13px;font-weight:700;color:#64748B">연수팀</span>
          </div>
          <div style="font-size:10.5px;color:#64748B;line-height:1.4">연수 관리 전용</div>
        </button>
      </div>
    </div>
    <div style="margin-bottom:16px">
      <div style="font-size:10.5px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">비밀번호</div>
      <div style="position:relative">
        <input id="_login_pw" type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')doLogin(_loginRole)"
          style="width:100%;padding:13px 48px 13px 16px;background:#0C1524;border:1.5px solid rgba(255,255,255,.1);border-radius:11px;color:#fff;font-size:14px;font-family:inherit;outline:none;box-sizing:border-box;transition:border-color .15s"
          onfocus="this.style.borderColor=&apos;#2563EB&apos;" onblur="this.style.borderColor='rgba(255,255,255,.1)'">
        <button id="_pw_toggle" onclick="var p=document.getElementById('_login_pw');var on=p.type==='password';p.type=on?'text':'password';this.querySelector('svg').style.opacity=on?'1':'0.5'" style="position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;display:flex;align-items:center" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.85'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div id="_login_err" style="display:none;margin-top:8px;font-size:12px;color:#F87171;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.2);border-radius:8px;padding:9px 13px">
        <i class="ti ti-alert-circle" style="font-size:13px;vertical-align:-2px;margin-right:5px" aria-hidden="true"></i>비밀번호가 올바르지 않습니다.
      </div>
      <!-- 비밀번호 저장 -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none">
          <input type="checkbox" id="_login_save_pw" style="width:15px;height:15px;accent-color:#2563EB;cursor:pointer">
          <span style="font-size:12px;color:#64748B">비밀번호 저장</span>
        </label>
        <button id="_login_clear_pw" onclick="clearSavedPw()" style="display:none;font-size:11px;color:#EF4444;background:none;border:none;cursor:pointer;font-family:inherit;padding:0">
          <i class="ti ti-trash" style="font-size:12px;vertical-align:-1px" aria-hidden="true"></i> 저장 삭제
        </button>
      </div>
    </div>
    <button id="_login_btn" onclick="doLogin(_loginRole)"
      style="width:100%;padding:14px;background:linear-gradient(135deg,#2563EB,#1E40AF);color:#fff;border:none;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.01em;transition:opacity .15s"
      onmouseover="this.style.opacity='.88'" onmouseout="this.style.opacity='1'">로그인</button>
    <div style="text-align:center;margin-top:22px;font-size:11px;color:#334155">Sorizava Academy · 채용지원 관리 시스템</div>
  </div>
</div>

<div id="_print_target"></div>
<div id="app" style="display:none;height:100vh;overflow:hidden;flex-direction:row"></div>
<script src="js/data/korea-map.js"></script>
<script src="js/data/members.js"></script>
<script src="js/data/employment-history.js"></script>
<script src="js/core/config.js"></script>
<script src="js/core/auth.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/data.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/core/layout.js"></script>
<script src="js/core/trash.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/counsel.js"></script>
<script src="js/views/training.js"></script>
<script src="js/views/employers.js"></script>
<script src="js/views/blacklist.js"></script>
<script src="js/views/jobs.js"></script>
<script src="js/views/inst-history.js"></script>
<script src="js/views/identify.js"></script>
<script src="js/views/favorites.js"></script>
<script src="js/views/employment.js"></script>
<script src="js/views/interview.js"></script>
<script src="js/views/students.js"></script>
<script src="js/views/calendar.js"></script>
<script src="js/views/insights.js"></script>
<script src="js/views/national.js"></script>
<script src="js/views/members.js"></script>
<script src="js/app.js"></script>
</body>
</html>
